name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.2

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  package:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
          registry: ${{ secrets.SCW_CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.SCW_CONTAINER_REGISTRY}}/cookhub:latest
            ${{ secrets.SCW_CONTAINER_REGISTRY}}/cookhub:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: package
    environment: production
    steps:
      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          export-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Deploy new container
        uses: scaleway/action-scw@v0
        with:
          args: container container update ${{ secrets.SCW_CONTAINER_ID }} registry-image=${{ secrets.SCW_CONTAINER_REGISTRY}}/cookhub:${{ github.sha }}
